# BGX 在线桌游 —— https://thinktwice.top/bgx/
# 前端静态文件：/var/www/bgx
# 后端（Fastify + Socket.IO）：127.0.0.1:8787
#
# 本文件由 deploy/deploy.sh 安装到 /etc/apache2/conf-available/bgx.conf
# 不改动已有的 piwigo 站点配置。

Alias /bgx /var/www/bgx

<Directory /var/www/bgx>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.html

    # SPA：找不到文件时回退到 index.html（支持 /bgx/m/<id> 直接刷新）
    RewriteEngine On
    RewriteBase /bgx/
    RewriteCond %{REQUEST_FILENAME} -f [OR]
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteRule ^ - [L]
    RewriteRule ^ /bgx/index.html [L]
</Directory>

# 带 hash 的静态资源可以长缓存；入口 HTML 不缓存
<Directory /var/www/bgx/assets>
    Header set Cache-Control "public, max-age=31536000, immutable"
</Directory>

<Directory /var/www/bgx>
    Header set Cache-Control "no-cache"
</Directory>

# API 反代
ProxyPreserveHost On
ProxyPass /bgx/api http://127.0.0.1:8787/api retry=0
ProxyPassReverse /bgx/api http://127.0.0.1:8787/api

# Socket.IO 反代（前端固定使用 websocket 传输）
ProxyPass /bgx/socket.io ws://127.0.0.1:8787/socket.io retry=0
ProxyPassReverse /bgx/socket.io http://127.0.0.1:8787/socket.io

<Location /bgx/api>
    RequestHeader set X-Forwarded-Proto "https"
    Header set Cache-Control "no-store"
</Location>

<Location /bgx/socket.io>
    RequestHeader set X-Forwarded-Proto "https"
</Location>
